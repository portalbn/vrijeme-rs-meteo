name: Osvjezi meteo podatke

on:
  schedule:
    - cron: "*/12 * * * *"
  workflow_dispatch:

jobs:
  osvjezi:
    runs-on: ubuntu-latest

    steps:
      - name: Preuzmi repozitorij
        uses: actions/checkout@v4

      - name: Preuzmi RHMZ podatke
        run: |
              curl --fail --retry 3 --insecure --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -o RHMZmeteoautomatskestanice.json "ftp://81.93.72.19/gost/RHMZmeteoautomatskestanice.json"

      - name: Preuzmi MeteoMapa
        run: |
                  curl --fail --retry 3 --insecure --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" -o MeteoMapa.json "ftp://81.93.72.19/gost/MeteoMapa.json"

      - name: Sacuvaj promjene
        run: |
          git config user.name "meteo-bot"
          git config user.email "meteo-bot@users.noreply.github.com"
          git add RHMZmeteoautomatskestanice.json MeteoMapa.json
          git diff --cached --quiet || git commit -m "Automatsko osvjezavanje meteo podataka"
          git push
